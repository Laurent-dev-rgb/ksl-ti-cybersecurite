[build]
publish="."
command="node scripts/security-check.mjs"

[[headers]]
for="/*"
[headers.values]
X-Content-Type-Options="nosniff"
X-Frame-Options="DENY"
Referrer-Policy="strict-origin-when-cross-origin"
Permissions-Policy="camera=(), microphone=(), geolocation=()"
Strict-Transport-Security="max-age=31536000; includeSubDomains"
Cross-Origin-Opener-Policy="same-origin"
Cross-Origin-Resource-Policy="same-site"
Content-Security-Policy="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; form-action 'self'; upgrade-insecure-requests"

[[headers]]
for="/assets/*"
[headers.values]
Cache-Control="public, max-age=31536000, immutable"
