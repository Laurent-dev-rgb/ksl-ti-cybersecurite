<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrières TI et cybersécurité | KSL</title><link rel="stylesheet" href="/assets/css/recruitment.css"></head><body>
<section class="hero"><div class="wrap"><p>KSL Conseils & Services S.E.N.C.</p><h1>Carrières TI et cybersécurité</h1><span>Joignez une équipe locale qui aide les PME à sécuriser et soutenir leurs technologies.</span></div></section>
<main class="wrap"><div class="grid"><section><h2>Offres disponibles</h2><div id="jobs"></div></section><section class="card"><h2>Postuler</h2><p class="muted">Les CV sont conservés dans un espace privé et accessibles uniquement aux administrateurs autorisés.</p><div id="form-status" class="hidden"></div><form id="application-form">

<script>window.KSL_RECRUITMENT_CONFIG={supabaseUrl:'VOTRE_URL_SUPABASE',supabaseAnonKey:'VOTRE_CLE_ANON_PUBLIQUE',division:'ti',divisions:['ti','cybersecurite'],source:'site_ti_cybersecurite'}</script><script type="module" src="/assets/js/recruitment.js"></script></body></html>
